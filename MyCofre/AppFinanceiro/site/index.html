<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/works/MyCofre/AppFinanceiro/site/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Controle seu dinheiro em um só lugar"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta id="theme-color-meta" name="theme-color" content="#e4e6ed" />
    <script>
      (function () {
        try {
          var k = 'appfinanceiro-theme'
          var v = localStorage.getItem(k)
          var isDark = v === 'dark'
          // Mantém o baseline (light) intacto: só aplica overrides no dark.
          document.documentElement.classList.toggle('dark', isDark)
          var m = document.getElementById('theme-color-meta')
          if (m) m.setAttribute('content', isDark ? '#121212' : '#e4e6ed')
        } catch (e) {}
      })()
    </script>
    <meta name="application-name" content="MyCofre" />
    <title>MyCofre</title>
    <script type="module" crossorigin src="/works/MyCofre/AppFinanceiro/site/assets/index-Dk3boRyQ.js"></script>
    <link rel="stylesheet" crossorigin href="/works/MyCofre/AppFinanceiro/site/assets/index-Buj9ML6w.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
